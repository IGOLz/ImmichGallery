name: 🐛 Bug report
description: Something in Immich Gallery isn't working as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, and what went wrong. Screenshots are welcome — just drag them here.
    validations:
      required: true

  - type: input
    attributes:
      label: Immich Gallery version
      placeholder: "0.4.2"
    validations:
      required: true

  - type: input
    attributes:
      label: macOS version
      placeholder: "macOS 15.5"
    validations:
      required: true
