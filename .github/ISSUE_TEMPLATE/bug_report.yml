name: 🐛 Bug report
description: Something in Immich Gallery isn't working as expected
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues (open and closed) and this is not a duplicate.
          required: true

  - type: textarea
    attributes:
      label: What happened?
      description: What you were trying to do, and what happened instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    attributes:
      label: Immich Gallery version
      placeholder: "0.4.2"
    validations:
      required: true

  - type: input
    attributes:
      label: macOS version
      placeholder: "macOS 15.5"
    validations:
      required: true

  - type: input
    attributes:
      label: Immich server version
      placeholder: "v2.0.0"

  - type: textarea
    attributes:
      label: Screenshots or additional information
      description: Optional. Drag images here or add anything else that might help.
